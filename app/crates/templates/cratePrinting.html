{% extends "master.html" %}

{% block content %}
    <h1>Crate {{ crate.id }}</h1>
    <p>Attached order: {{ crate.order }}</p>

    <h2>Items to print/convert</h2>
    <table>
        <tr>
            <th>From</th>
            <th>To</th>
            <th>Quantity</th>
        </tr>
        {% for base, derived, qty in print_list %}
            <tr>
                <td>{{ base.name }}</td>
                <td>{{ derived.name }}</td>
                <td>{{ qty }}</td>
            </tr>
        {% endfor %}
    </table>

    <button onclick="completePrinting()">Printing Complete</button>

    <p><a href="/">go home</a> <a href="/crates">to crates</a></p>

    <script>
        function getCookie(name) {
            const match = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
            return match ? match.pop() : '';
        }

        function completePrinting() {
            fetch(`/crates/{{ crate.id }}/completePrinting/`, {
                method: 'POST',
                headers: { 'X-CSRFToken': getCookie('csrftoken') }
            }).then(response => {
                if (response.ok) {
                    location.reload();
                } else {
                    alert('Could not complete printing.');
                }
            });
        }
    </script>
{% endblock content %}
